<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メモアプリ</title>

  <link rel="manifest" href="manifest.json" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 20px;
      background: #f7f7f7;
    }
    h1 {
      font-size: 20px;
    }
    textarea {
      width: 100%;
      height: 60vh;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
      width: 100%;
    }
  </style>
</head>

<body>
  <h1>📝 メモ</h1>

  <textarea id="memo" placeholder="ここにメモを書いてください"></textarea>
<p id="time">最終更新：なし</p>
  
  <button onclick="clearMemo()">すべて消す</button>

  <script>
  const memo = document.getElementById("memo");
  const time = document.getElementById("time");

  function updateTime() {
    const now = new Date();
    const text =
      now.getFullYear() +
      "/" +
      (now.getMonth() + 1) +
      "/" +
      now.getDate() +
      " " +
      now.getHours() +
      ":" +
      now.getMinutes().toString().padStart(2, "0");

    time.textContent = "最終更新：" + text;
    localStorage.setItem("memo_time", text);
  }

  // 起動時に読み込み
  memo.value = localStorage.getItem("memo") || "";
  time.textContent =
    "最終更新：" + (localStorage.getItem("memo_time") || "なし");

  // 入力のたびに保存
  memo.addEventListener("input", () => {
    localStorage.setItem("memo", memo.value);
    updateTime();
  });

  function clearMemo() {
    if (confirm("本当に消しますか？")) {
      memo.value = "";
      localStorage.removeItem("memo");
      localStorage.removeItem("memo_time");
      time.textContent = "最終更新：なし";
    }
  }
</script>
</body>
</html>
