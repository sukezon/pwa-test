<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メモアプリ</title>

  <link rel="manifest" href="manifest.json" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #f5f7fb, #e9eef6);
      margin: 0;
      padding: 16px;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 120px;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
      width: 100%;
      border-radius: 10px;
      border: none;
      background: #007aff;
      color: #fff;
    }

    button:active {
      opacity: 0.8;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 16px;
    }

    li {
      background: #fff;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .time {
      font-size: 12px;
      color: gray;
      margin-top: 4px;
    }

    .memo-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .memo-buttons button {
      flex: 1;
      font-size: 14px;
      padding: 8px;
    }

    .memo-image {
      width: 60px;
      margin-top: 8px;
      border-radius: 6px;
    }

    .fullscreen {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .fullscreen img {
      max-width: 90%;
      max-height: 90%;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>📝 メモ</h1>

    <textarea id="memoInput" placeholder="新しいメモを書く"></textarea>
    <button onclick="saveMemo()">保存</button>
    <button id="sortBtn" onclick="toggleSort()">並び替え：新しい順</button>

    <ul id="memoList"></ul>
  </div>

  <!-- 画像選択用（非表示） -->
  <input type="file" id="imageInput" accept="image/*" style="display:none;">

<script>
  let memos = JSON.parse(localStorage.getItem("memos")) || [];
  let editIndex = null;
  let sortNewest = true;
  let imageTargetIndex = null;

  function saveMemo() {
    const text = document.getElementById("memoInput").value.trim();
    if (!text) return;

    const time = new Date().toLocaleString("ja-JP");

    if (editIndex === null) {
      memos.unshift({ text, time });
    } else {
      memos[editIndex].text = text;
      editIndex = null;
    }

    localStorage.setItem("memos", JSON.stringify(memos));
    document.getElementById("memoInput").value = "";
    render();
  }

  function deleteMemo(index) {
    if (!confirm("このメモを削除しますか？")) return;
    memos.splice(index, 1);
    localStorage.setItem("memos", JSON.stringify(memos));
    render();
  }

  function toggleSort() {
    sortNewest = !sortNewest;
    render();
  }

  function addImage(index) {
    imageTargetIndex = index;
    document.getElementById("imageInput").click();
  }

  document.getElementById("imageInput").addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  const img = new Image();
  const reader = new FileReader();

  reader.onload = function () {
    img.src = reader.result;
  };

  img.onload = function () {
    const maxSize = 800; // 最大辺(px)
    let { width, height } = img;

    if (width > height && width > maxSize) {
      height = height * (maxSize / width);
      width = maxSize;
    } else if (height > maxSize) {
      width = width * (maxSize / height);
      height = maxSize;
    }

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, width, height);

    const compressed = canvas.toDataURL("image/jpeg", 0.7);

    memos[imageTargetIndex].image = compressed;
    localStorage.setItem("memos", JSON.stringify(memos));
    render();
  };

  reader.readAsDataURL(file);
  this.value = "";
});
  

  function toggleImage(img) {
    const overlay = document.createElement("div");
    overlay.className = "fullscreen";
    overlay.onclick = () => overlay.remove();

    const bigImg = document.createElement("img");
    bigImg.src = img.src;

    overlay.appendChild(bigImg);
    document.body.appendChild(overlay);
  }

  function render() {
    const list = document.getElementById("memoList");
    list.innerHTML = "";

    const sorted = [...memos];
    if (!sortNewest) sorted.reverse();

    document.getElementById("sortBtn").textContent =
      "並び替え：" + (sortNewest ? "新しい順" : "古い順");

    sorted.forEach((memo) => {
      const realIndex = memos.indexOf(memo);
      const li = document.createElement("li");

      li.innerHTML = `
        <div>${memo.text.replace(/\n/g, "<br>")}</div>
        <div class="time">${memo.time}</div>

        <div class="memo-buttons">
          <button onclick="addImage(${realIndex}); event.stopPropagation();">📷 画像</button>
          <button onclick="deleteMemo(${realIndex}); event.stopPropagation();">削除</button>        </div>

        ${memo.image ? `<img src="${memo.image}" class="memo-image" onclick="toggleImage(this)">` : ""}
      `;

      li.onclick = () => {
        document.getElementById("memoInput").value = memo.text;
        editIndex = realIndex;
      };

      list.appendChild(li);
    });
  }

  render();
</script>
</body>
</html>
