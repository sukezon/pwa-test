<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>複数メモ</title>

  <link rel="manifest" href="manifest.json" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 15px;
      background: #f7f7f7;
    }
    h1 {
      font-size: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
      width: 100%;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: white;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
    }
    .time {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>
  <h1>📝 メモ</h1>

  <textarea id="memoInput" placeholder="新しいメモを書く"></textarea>
  <button onclick="saveMemo()">保存</button>

  <ul id="memoList"></ul>

<script>
  let memos = JSON.parse(localStorage.getItem("memos")) || [];
  let editIndex = null;

  function saveMemo() {
    const text = document.getElementById("memoInput").value.trim();
    if (!text) return;

    const time = new Date().toLocaleString("ja-JP");

    if (editIndex === null) {
      memos.unshift({ text, time });
    } else {
      memos[editIndex] = { text, time };
      editIndex = null;
    }

    localStorage.setItem("memos", JSON.stringify(memos));
    document.getElementById("memoInput").value = "";
    render();
  }

  function deleteMemo(index) {
    if (!confirm("このメモを削除しますか？")) return;
    memos.splice(index, 1);
    localStorage.setItem("memos", JSON.stringify(memos));
    render();
  }

  function render() {
    const list = document.getElementById("memoList");
    list.innerHTML = "";

    memos.forEach((memo, index) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div>${memo.text.replace(/\n/g, "<br>")}</div>
        <div class="time">${memo.time}</div>
        <button onclick="deleteMemo(${index})">削除</button>
      `;
      li.onclick = () => {
        document.getElementById("memoInput").value = memo.text;
        editIndex = index;
      };
      list.appendChild(li);
    });
  }

  render();
</script>
</body>
</html>
